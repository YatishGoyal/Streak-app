<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hearth — Daily Study Streak</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

:root{
  /* dark mode — deep tinted charcoal, never pure black */
  --bg: #12151B;
  --surface: #1A1F27;
  --surface-elevated: #212733;
  --bg-elevated: #1A1F27;
  --bg-card: #1E242E;
  --line: rgba(237,239,243,0.08);
  --line-soft: rgba(237,239,243,0.05);

  --text-hi: #EDEFF3;
  --text-mid: #A6AEBB;
  --text-low: #6F7787;

  --accent: #E0752C;
  --accent-strong: #F0924D;
  --accent-soft: rgba(224,117,44,0.16);
  --accent-on: #12151B;

  --success: #4CC38A;
  --warning: #F0C24D;
  --error: #F2695F;

  --focus-ring: rgba(224,117,44,0.45);

  /* flame progression — derived from the accent family */
  --ember-1: #6E4224;
  --ember-1-glow: #E0752C;
  --ember-2: #E0752C;
  --ember-2-glow: #F0924D;
  --ember-3: #F0924D;
  --ember-3-glow: #F7B577;
  --gold-1: #F0C24D;
  --gold-2: #FBE1A0;
  --legend-1: #F7CB5F;
  --legend-2: #F0924D;
  --legend-aura: #8C7BFF;

  --glow-color: rgba(224,117,44,0.12);

  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;
}

:root[data-theme="light"]{
  /* light mode — cool-tinted off-white, not pure white */
  --bg: #EEF1F4;
  --surface: #FFFFFF;
  --surface-elevated: #FFFFFF;
  --bg-elevated: #FFFFFF;
  --bg-card: #E6EAEE;
  --line: rgba(27,36,48,0.10);
  --line-soft: rgba(27,36,48,0.05);

  --text-hi: #1B2430;
  --text-mid: #5B6572;
  --text-low: #8B95A1;

  --accent: #D9691F;
  --accent-strong: #B8551A;
  --accent-soft: rgba(217,105,31,0.10);
  --accent-on: #FFFFFF;

  --success: #2E9E6B;
  --warning: #B87C16;
  --error: #C94A40;

  --focus-ring: rgba(217,105,31,0.35);

  --ember-1: #C8894A;
  --ember-1-glow: #D9691F;
  --ember-2: #D9691F;
  --ember-2-glow: #E88A3D;
  --ember-3: #E88A3D;
  --ember-3-glow: #F0A65E;
  --gold-1: #B87C16;
  --gold-2: #E8C374;
  --legend-1: #D9A53A;
  --legend-2: #E88A3D;
  --legend-aura: #7C5CE0;

  --glow-color: rgba(217,105,31,0.06);
}

*{ box-sizing: border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, var(--glow-color), transparent 60%),
    var(--bg);
  color: var(--text-hi);
  font-family: var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x:hidden;
  transition: background-color .35s ease, color .35s ease;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

.app{
  max-width: 640px;
  margin: 0 auto;
  padding: 28px 20px 64px;
  position: relative;
}

/* ---------- header ---------- */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding: 4px 2px 8px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 20px;
  letter-spacing: 0.01em;
  color: var(--text-hi);
}
.brand-mark{
  width: 22px; height: 22px;
  display:inline-block;
}
.icon-btn{
  width: 38px; height: 38px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-elevated);
  color: var(--text-mid);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition: border-color .2s ease, color .2s ease, transform .15s ease;
}
.icon-btn:hover{ color: var(--text-hi); border-color: var(--line); background: var(--bg-card); }
.icon-btn:active{ transform: scale(0.94); }
.icon-btn:focus-visible{ outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.icon-btn svg{ width:16px; height:16px; }

/* ---------- hero ---------- */
.hero{
  text-align:center;
  padding: 32px 20px 26px;
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  transition: background-color .35s ease, border-color .35s ease;
}

.flame-stage{
  position: relative;
  width: 220px;
  height: 220px;
  margin: 6px auto 4px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.flame-core{
  position: relative;
  width: 92px;
  height: 118px;
  transform-origin: 50% 100%;
  transition: width .6s cubic-bezier(.2,.8,.2,1), height .6s cubic-bezier(.2,.8,.2,1);
}
.flame-shape{
  position:absolute;
  inset:0;
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  filter: blur(0.3px);
  animation: flicker 2.6s ease-in-out infinite;
}
.flame-shape.outer{
  background: radial-gradient(circle at 50% 70%, var(--ember-1-glow) 0%, var(--ember-1) 55%, transparent 78%);
  opacity: 0.9;
}
.flame-shape.inner{
  width: 58%; height: 66%;
  left: 21%; top: 18%;
  background: radial-gradient(circle at 50% 75%, #FFE9C2 0%, var(--ember-1-glow) 45%, transparent 75%);
  animation-delay: -0.6s;
  opacity: 0.85;
}
.flame-base-glow{
  position:absolute;
  bottom: -18px; left: 50%;
  width: 140px; height: 60px;
  transform: translateX(-50%);
  background: radial-gradient(ellipse, var(--ember-1-glow) 0%, transparent 72%);
  opacity: 0.35;
  filter: blur(6px);
  transition: background .6s ease;
}

@keyframes flicker{
  0%,100%{ transform: scale(1,1) skewX(0deg); }
  20%{ transform: scale(1.03,0.97) skewX(-1.5deg); }
  45%{ transform: scale(0.97,1.04) skewX(1.5deg); }
  70%{ transform: scale(1.02,0.98) skewX(-1deg); }
}

/* stage 2: 7-29 days — bigger, more energetic */
.flame-stage.stage2 .flame-core{ width: 112px; height: 148px; }
.flame-stage.stage2 .flame-shape.outer{
  background: radial-gradient(circle at 50% 70%, var(--ember-2-glow) 0%, var(--ember-2) 55%, transparent 78%);
}
.flame-stage.stage2 .flame-shape.inner{
  background: radial-gradient(circle at 50% 75%, #FFF1D6 0%, var(--ember-2-glow) 45%, transparent 75%);
}
.flame-stage.stage2 .flame-shape{ animation-duration: 2s; }
.flame-stage.stage2 .flame-base-glow{ background: radial-gradient(ellipse, var(--ember-2-glow) 0%, transparent 72%); opacity: 0.45; }

/* stage 3: 30-99 days — glowing particles */
.flame-stage.stage3 .flame-core{ width: 128px; height: 168px; }
.flame-stage.stage3 .flame-shape.outer{
  background: radial-gradient(circle at 50% 70%, var(--ember-3-glow) 0%, var(--ember-3) 55%, transparent 78%);
}
.flame-stage.stage3 .flame-shape.inner{
  background: radial-gradient(circle at 50% 75%, #FFF7E4 0%, var(--ember-3-glow) 45%, transparent 75%);
}
.flame-stage.stage3 .flame-shape{ animation-duration: 1.8s; }
.flame-stage.stage3 .flame-base-glow{ background: radial-gradient(ellipse, var(--ember-3-glow) 0%, transparent 72%); opacity: 0.55; }

/* stage 4: 100-364 — golden */
.flame-stage.stage4 .flame-core{ width: 140px; height: 182px; }
.flame-stage.stage4 .flame-shape.outer{
  background: radial-gradient(circle at 50% 70%, var(--gold-2) 0%, var(--gold-1) 55%, transparent 78%);
}
.flame-stage.stage4 .flame-shape.inner{
  background: radial-gradient(circle at 50% 75%, #FFFBEF 0%, var(--gold-2) 45%, transparent 75%);
}
.flame-stage.stage4 .flame-shape{ animation-duration: 1.7s; }
.flame-stage.stage4 .flame-base-glow{ background: radial-gradient(ellipse, var(--gold-1) 0%, transparent 72%); opacity: 0.6; }

/* stage 5: 365+ — legendary aura */
.flame-stage.stage5 .flame-core{ width: 154px; height: 198px; }
.flame-stage.stage5 .flame-shape.outer{
  background: radial-gradient(circle at 50% 70%, var(--legend-1) 0%, var(--legend-2) 55%, transparent 78%);
}
.flame-stage.stage5 .flame-shape.inner{
  background: radial-gradient(circle at 50% 75%, #FFFDF6 0%, var(--legend-1) 45%, transparent 75%);
}
.flame-stage.stage5 .flame-shape{ animation-duration: 1.6s; }
.flame-stage.stage5 .flame-base-glow{ background: radial-gradient(ellipse, var(--legend-1) 0%, transparent 72%); opacity: 0.7; }

.aura-ring{
  position:absolute;
  inset: -6px;
  border-radius: 50%;
  opacity: 0;
  pointer-events:none;
}
.flame-stage.stage5 .aura-ring{
  opacity: 1;
  background: radial-gradient(circle, transparent 48%, color-mix(in srgb, var(--legend-aura) 30%, transparent) 60%, transparent 72%);
  animation: aura-pulse 3.4s ease-in-out infinite;
}
@keyframes aura-pulse{
  0%,100%{ transform: scale(0.96); opacity: 0.6; }
  50%{ transform: scale(1.06); opacity: 1; }
}

.particles{ position:absolute; inset:0; pointer-events:none; opacity:0; transition: opacity .6s ease; }
.flame-stage.stage3 .particles,
.flame-stage.stage4 .particles,
.flame-stage.stage5 .particles{ opacity: 1; }
.particle{
  position:absolute;
  bottom: 70px;
  left: 50%;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--ember-3-glow);
  animation: rise 3.2s ease-in infinite;
  opacity: 0;
}
.stage4 .particle{ background: var(--gold-2); }
.stage5 .particle{ background: var(--legend-1); }
.particle:nth-child(1){ left: 42%; animation-delay: 0s; }
.particle:nth-child(2){ left: 58%; animation-delay: 0.7s; }
.particle:nth-child(3){ left: 48%; animation-delay: 1.5s; }
.particle:nth-child(4){ left: 63%; animation-delay: 2.1s; }
.particle:nth-child(5){ left: 38%; animation-delay: 0.4s; }
.particle:nth-child(6){ left: 53%; animation-delay: 1.9s; }
@keyframes rise{
  0%{ transform: translate(-50%, 0) scale(0.6); opacity: 0; }
  15%{ opacity: 0.9; }
  100%{ transform: translate(-50%, -150px) scale(0.2); opacity: 0; }
}

/* streak number */
.streak-block{ margin-top: 6px; }
.streak-number{
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 64px;
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--text-hi);
  font-variant-numeric: tabular-nums;
}
.streak-label{
  font-size: 13px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-low);
  margin-top: 6px;
  font-weight: 600;
}
.longest{
  font-size: 12px;
  color: var(--text-low);
  margin-top: 4px;
}
.longest strong{ color: var(--text-mid); font-weight: 600; }

.sub-line{
  font-size: 12.5px;
  color: var(--text-low);
  margin-top: 8px;
  min-height: 16px;
  transition: color .3s ease;
}
.sub-line.pb-hit{
  color: var(--accent-strong);
  font-weight: 700;
  letter-spacing: 0.02em;
}
.sub-line.pb-pop{ animation: pb-pop 0.6s cubic-bezier(.34,1.56,.64,1); }
@keyframes pb-pop{
  0%{ transform: scale(0.85); opacity: 0.4; }
  60%{ transform: scale(1.08); }
  100%{ transform: scale(1); opacity: 1; }
}

.freeze-badge{
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 10px;
  padding: 5px 11px;
  border-radius: 999px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  color: var(--text-mid);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  opacity: 1;
  transition: opacity .3s ease, transform .3s ease, border-color .3s ease;
}
.freeze-badge svg{ width: 13px; height: 13px; color: var(--legend-aura); flex-shrink: 0; }
.freeze-badge .freeze-max{ color: var(--text-low); font-weight: 500; }
.freeze-badge.zero{ opacity: 0.55; }
.freeze-badge.zero svg{ color: var(--text-low); }
.freeze-badge.pop{ animation: cell-pop 0.5s cubic-bezier(.34,1.56,.64,1); border-color: var(--legend-aura); }

.freeze-toast{
  margin-top: 8px;
  font-size: 12px;
  color: var(--legend-aura);
  font-weight: 600;
  max-width: 260px;
  margin-left: auto;
  margin-right: auto;
  opacity: 0;
  transform: translateY(-4px);
  transition: opacity .35s ease, transform .35s ease;
}
.freeze-toast.show{ opacity: 1; transform: translateY(0); }

/* stats row */
.stats-row{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 14px;
}
.stat-card{
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px 10px;
  text-align: center;
  transition: background-color .35s ease, border-color .35s ease;
}
.stat-value{
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 22px;
  color: var(--text-hi);
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.stat-of{
  font-size: 14px;
  color: var(--text-low);
  font-weight: 600;
}
.stat-label{
  font-size: 11px;
  color: var(--text-low);
  margin-top: 4px;
  letter-spacing: 0.03em;
}

/* button */
.check-in-btn{
  position: relative;
  margin: 26px auto 0;
  display: flex;
  align-items:center;
  justify-content:center;
  gap: 10px;
  width: 100%;
  max-width: 320px;
  padding: 17px 20px;
  border-radius: 14px;
  border: none;
  background: var(--accent);
  color: var(--accent-on);
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 0.01em;
  cursor: pointer;
  box-shadow: 0 8px 20px -8px var(--accent-soft), inset 0 1px 0 rgba(255,255,255,0.18);
  transition: transform .15s ease, box-shadow .3s ease, background-color .3s ease;
}
.check-in-btn:hover{ transform: translateY(-1px); background: var(--accent-strong); }
.check-in-btn:active{ transform: translateY(0) scale(0.98); }
.check-in-btn:disabled{ cursor: default; }
.check-in-btn:focus-visible{ outline: 2px solid var(--focus-ring); outline-offset: 3px; }

.check-in-btn.done{
  background: var(--success);
  box-shadow: 0 8px 20px -10px rgba(76,195,138,0.35), inset 0 1px 0 rgba(255,255,255,0.12);
  color: var(--accent-on);
}
.check-in-btn .btn-icon{ width: 18px; height: 18px; flex-shrink:0; }
.check-in-btn .check-mark{
  transform: scale(0);
  transition: transform .35s cubic-bezier(.34,1.56,.64,1);
}
.check-in-btn.done .check-mark{ transform: scale(1); }
.check-in-btn.done .flame-icon{ display:none; }
.check-in-btn:not(.done) .check-mark{ display:none; }

.check-in-btn.pulse{ animation: btn-pulse .5s ease; }
@keyframes btn-pulse{
  0%{ transform: scale(1); }
  40%{ transform: scale(0.94); }
  70%{ transform: scale(1.03); }
  100%{ transform: scale(1); }
}

/* message */
.message-wrap{
  min-height: 54px;
  margin-top: 18px;
  padding: 0 12px;
}
.message-text{
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 500;
  color: var(--text-mid);
  line-height: 1.5;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity .5s ease, transform .5s ease;
}
.message-text.show{ opacity: 1; transform: translateY(0); color: var(--text-hi); }

/* hearth grid */
.hearth-section{
  margin-top: 14px;
  padding: 24px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  transition: background-color .35s ease, border-color .35s ease;
}
.hearth-heading{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  margin-bottom: 14px;
}
.hearth-heading h2{
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  color: var(--text-hi);
  margin: 0;
  letter-spacing: 0.02em;
}
.hearth-heading span{
  font-size: 12px;
  color: var(--text-low);
  font-family: var(--font-mono);
}
.hearth-grid{
  display: grid;
  grid-template-columns: repeat(14, 1fr);
  gap: 5px;
}
.hearth-cell{
  aspect-ratio: 1;
  border-radius: 4px;
  background: var(--bg-card);
  border: 1px solid var(--line-soft);
  transition: transform .2s ease;
}
.hearth-cell.lit{
  background: var(--ember-2-glow);
  border-color: transparent;
}
.hearth-cell.lit.gold{ background: var(--gold-1); }
.hearth-cell.lit.legend{ background: var(--legend-1); box-shadow: 0 0 8px var(--accent-soft); }
.hearth-cell.frozen{
  background: var(--bg-card);
  border-color: var(--line);
  position: relative;
  background-image: radial-gradient(circle at 50% 50%, var(--legend-aura) 0%, transparent 70%);
  opacity: 0.8;
}
.hearth-cell.frozen::after{
  content: "❄";
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 8px;
  color: var(--legend-aura);
  line-height: 1;
}
.hearth-cell.today-cell{ outline: 1.5px solid var(--accent); outline-offset: 1px; }
.hearth-cell.new{ animation: cell-pop .5s cubic-bezier(.34,1.56,.64,1); }
@keyframes cell-pop{
  0%{ transform: scale(0.4); }
  70%{ transform: scale(1.15); }
  100%{ transform: scale(1); }
}

.footnote{
  margin-top: 22px;
  text-align:center;
  font-size: 12.5px;
  color: var(--text-low);
  line-height: 1.6;
}

/* confetti */
#confettiCanvas{
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 50;
}

/* milestone celebration */
.milestone-overlay{
  position: fixed;
  inset: 0;
  background: color-mix(in srgb, var(--bg) 72%, transparent);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 60;
  opacity: 0;
  pointer-events: none;
  transition: opacity .35s ease;
  padding: 20px;
}
.milestone-overlay.show{ opacity: 1; pointer-events: auto; }
.milestone-card{
  --milestone-glow: var(--accent);
  background: var(--surface);
  border: 1.5px solid color-mix(in srgb, var(--milestone-glow) 55%, var(--line));
  border-radius: 20px;
  padding: 32px 28px;
  max-width: 320px;
  width: 100%;
  text-align: center;
  transform: scale(0.85) translateY(10px);
  transition: transform .4s cubic-bezier(.34,1.56,.64,1), border-color .3s ease;
  box-shadow: 0 24px 60px -20px rgba(0,0,0,0.35), 0 0 40px -12px color-mix(in srgb, var(--milestone-glow) 45%, transparent);
}
.milestone-overlay.show .milestone-card{ transform: scale(1) translateY(0); }
.milestone-icon{
  font-size: 34px;
  margin-bottom: 10px;
}
.milestone-title{
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  color: var(--text-hi);
  margin-bottom: 6px;
}
.milestone-sub{
  font-size: 13.5px;
  color: var(--text-mid);
  line-height: 1.5;
  margin-bottom: 20px;
}
.milestone-close{
  border: none;
  background: var(--milestone-glow, var(--accent));
  color: var(--accent-on);
  font-weight: 700;
  font-size: 14px;
  padding: 11px 22px;
  border-radius: 12px;
  cursor: pointer;
  transition: filter .2s ease, transform .15s ease;
}
.milestone-close:hover{ filter: brightness(1.1); }
.milestone-close:active{ transform: scale(0.97); }

@media (max-width: 420px){
  .app{ padding: 20px 14px 48px; }
  .hero{ padding: 26px 14px 22px; }
  .streak-number{ font-size: 52px; }
  .flame-stage{ width: 180px; height: 180px; }
  .stats-row{ gap: 8px; }
  .stat-card{ padding: 12px 6px; border-radius: 12px; }
  .stat-value{ font-size: 19px; }
  .stat-label{ font-size: 10px; }
  .hearth-section{ padding: 18px; }
  .hearth-grid{ gap: 4px; }
  .check-in-btn{ font-size: 15px; padding: 15px 16px; }
}

@media (max-width: 340px){
  .hearth-grid{ grid-template-columns: repeat(10, 1fr); }
}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none">

  function todayStr(d){
    d = d || new Date();
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+day;
  }
  function parseDate(s){
    var p = s.split('-');
    return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
  }
  function daysBetween(a,b){
    var A = parseDate(a), B = parseDate(b);
    return Math.round((B-A)/86400000);
  }
  function addDays(dateStr, n){

    d.setDate(d.getDate()+n);
    return todayStr(d);

      // — meaningful milestones —
      milestonesUnlocked: []       // e.g. [7, 30, 100, 365]
    };
  }

  function shuffledIndices(len){
    var arr = [];
    for(var i=0;i<len;i++) arr.push(i);
    for(var i=arr.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = arr[i]; arr[i]=arr[j]; arr[j]=t;
    }
    return arr;
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        var merged = Object.assign(defaultState(), parsed);
        // migration: older saves have no personalBest field — seed it from
        // the existing longest streak so the record isn't lost.
        if(!parsed.hasOwnProperty('personalBest')){
          merged.personalBest = merged.longest;
        }
        return merged;
      }
    }catch(e){ console.error('storage read failed', e); }
    return defaultState();
  }

  function saveState(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    }catch(e){ console.error('storage save failed', e); }
  }

    if(!state.queue || state.queue.length === 0){
      state.queue = shuffledIndices(GENERAL.length);
    }
    var idx = state.queue.shift();
    return GENERAL[idx];
  }

  milestoneClose.addEventListener('click', hideMilestoneCelebration);
  milestoneOverlay.addEventListener('click', function(e){
    if(e.target === milestoneOverlay) hideMilestoneCelebration();
  });

  /* ---------------- freeze-earned toast (small celebration) ---------------- */
  var freezeToast = document.getElementById('freezeToast');
  function showFreezeEarnedToast(){
    freezeToast.classList.add('show');
    freezeBadge.classList.add('pop');
    clearTimeout(freezeToast._hideTimer);
    freezeToast._hideTimer = setTimeout(function(){
      freezeToast.classList.remove('show');
    }, 3200);
  }

  function renderStatic(){
    streakNumberEl.textContent = state.streak;
    streakLabelEl.textContent = 'day streak';
    renderFlameStage(state.streak, false);
    updateStats();
    renderSubLine(false);
    renderFreezeBadge(false);

    var today = todayStr();
    var checkedToday = state.lastCheckIn === today;
    checkInBtn.classList.toggle('done', checkedToday);
    checkInBtn.disabled = checkedToday;
    checkInBtn.setAttribute('aria-pressed', checkedToday ? 'true' : 'false');
    btnLabel.textContent = checkedToday ? 'Studied Today' : 'I Studied Today';

    // gentle, guilt-free notices — shown once on load, never phrased as a penalty.
    if(!checkedToday && state.lastCheckIn && daysBetween(state.lastCheckIn, today) > 1 && state.streak === 0 && state.longest > 0){
      messageText.textContent = "New flame, same fireplace. Every streak you've built is still on your hearth below.";
      messageText.classList.add('show');
    } else if(!checkedToday && state.lastCheckIn === addDays(today, -1) && state.freezes > 0){
      // smart freeze warning — only surfaced when relevant, never nagging
      messageText.textContent = "Your streak is waiting. 🛡 " + state.freezes + " freeze available.";
      messageText.classList.add('show');
    } else if(!checkedToday && state.lastCheckIn === addDays(today, -1)){
      messageText.textContent = "Day " + (state.streak + 1) + " is waiting whenever you're ready.";
      messageText.classList.add('show');
    }

    renderHearth();
  }

  function renderHearth(days){
    days = days || 84;
    hearthGrid.innerHTML = '';
    var historySet = {};
    state.history.forEach(function(d){ historySet[d] = true; });
    var frozenSet = {};
    (state.frozenDates || []).forEach(function(d){ frozenSet[d] = true; });
    var today = todayStr();
    var stage = stageFor(state.streak);
    var stageClass = stage >= 5 ? 'legend' : (stage >= 4 ? 'gold' : '');

    var cells = [];
    for(var i=days-1;i>=0;i--){
      cells.push(addDays(today, -i));
    }
    cells.forEach(function(d){
      var cell = document.createElement('div');
      cell.className = 'hearth-cell';
      if(frozenSet[d]){
        // a frozen day preserves the streak but was never studied — shown distinctly,
        // and never counted as lit / studied.
        cell.classList.add('frozen');
        cell.setAttribute('aria-label', 'Streak freeze used');
      } else if(historySet[d]){
        cell.classList.add('lit');
        if(stageClass) cell.classList.add(stageClass);
      }
      if(d === today) cell.classList.add('today-cell');
      hearthGrid.appendChild(cell);
    });
  }

  function countUp(from, to, duration){
    var startTime = null;
    function step(ts){
      if(startTime === null) startTime = ts;
      var progress = Math.min((ts - startTime) / duration, 1);
      var eased = 1 - Math.pow(1 - progress, 3);
      var val = Math.round(from + (to - from) * eased);
      streakNumberEl.textContent = val;
      if(progress < 1) requestAnimationFrame(step);
      else streakNumberEl.textContent = to;
    }
    requestAnimationFrame(step);
  }

  /* ---------------- confetti ---------------- */
  function getThemeColors(){
    var cs = getComputedStyle(document.documentElement);
    var vars = ['--accent','--accent-strong','--gold-1','--gold-2','--legend-1','--legend-aura','--success'];
    return vars.map(function(v){ return cs.getPropertyValue(v).trim(); }).filter(Boolean);
  }
  function burstConfetti(intensity){
    intensity = intensity || 1;
    var confettiColors = getThemeColors();
    if(confettiColors.length === 0) confettiColors = ['#E0752C','#F0924D','#F0C24D'];
    var particles = [];
    var count = Math.round(90 * intensity);
    var w = canvas.width, h = canvas.height;
    var originX = w/2, originY = h*0.32;
    for(var i=0;i<count;i++){
      var angle = (Math.random()*Math.PI) + Math.PI; // upward-ish spread
      var speed = 4 + Math.random()*7;
      particles.push({
        x: originX, y: originY,
        vx: Math.cos(angle)*speed*0.6 + (Math.random()-0.5)*4,
        vy: -Math.abs(Math.sin(angle))*speed - 2,
        size: 4 + Math.random()*5,
        color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
        rot: Math.random()*Math.PI*2,
        vrot: (Math.random()-0.5)*0.3,
        gravity: 0.18 + Math.random()*0.08,
        life: 0,
        maxLife: 130 + Math.random()*60,
        shape: Math.random() > 0.5 ? 'rect' : 'circle'
      });
    }
    var start = null;
    var duration = 2600;
    function frame(ts){
      if(!start) start = ts;
      var elapsed = ts - start;
      ctx.clearRect(0,0,w,h);
      particles.forEach(function(p){
        p.vy += p.gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vrot;
        p.life++;
        var alpha = Math.max(0, 1 - (p.life / p.maxLife));
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        if(p.shape === 'rect'){
          ctx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.66);
        } else {
          ctx.beginPath();
          ctx.arc(0,0,p.size/2,0,Math.PI*2);
          ctx.fill();
        }
        ctx.restore();
      });
      if(elapsed < duration){
        requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0,0,w,h);
      }
    }
    requestAnimationFrame(frame);
  }

  /* ---------------- sound ---------------- */
  var audioCtx = null;
  function playChime(){
    if(state.muted) return;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var now = audioCtx.currentTime;
      var notes = [523.25, 659.25, 783.99]; // C5 E5 G5
      notes.forEach(function(freq, i){
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        var t0 = now + i*0.09;
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(0.09, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.7);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.75);
      });
    }catch(e){ /* audio not available */ }
  }

  // a quieter, cooler two-note chime — distinct from the main check-in
  // chime so earning a freeze reads as its own small moment.
  function playFreezeChime(){
    if(state.muted) return;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var now = audioCtx.currentTime;
      var notes = [880, 1108.73]; // A5, C#6 — bright, glassy, brief
      notes.forEach(function(freq, i){
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        var t0 = now + i*0.11;
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(0.055, t0 + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.55);
      });
    }catch(e){ /* audio not available */ }
  }

  /* ---------------- theme toggle ---------------- */
  var THEME_KEY = "hearth_theme";
  var themeBtn = document.getElementById('themeBtn');
  var sunIcon = document.getElementById('sunIcon');
  var moonIcon = document.getElementById('moonIcon');

  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    sunIcon.style.display = theme === 'light' ? 'block' : 'none';
    moonIcon.style.display = theme === 'light' ? 'none' : 'block';
    try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
  }

  function getPreferredTheme(){
    try{
      var saved = localStorage.getItem(THEME_KEY);
      if(saved === 'light' || saved === 'dark') return saved;
    }catch(e){}
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }

  themeBtn.addEventListener('click', function(){
    var current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    applyTheme(current === 'light' ? 'dark' : 'light');
  });

  applyTheme(getPreferredTheme());

  /* ---------------- mute toggle ---------------- */
  var muteBtn = document.getElementById('muteBtn');
  var soundOn = document.getElementById('soundOnIcon');
  var soundOff = document.getElementById('soundOffIcon');
  function renderMute(){
    soundOn.style.display = state.muted ? 'none' : 'block';
    soundOff.style.display = state.muted ? 'block' : 'none';
  }
  muteBtn.addEventListener('click', function(){
    state.muted = !state.muted;
    renderMute();
    saveState();
  });

  /* ---------------- check-in ---------------- */
  checkInBtn.addEventListener('click', function(){
    var today = todayStr();
    if(state.lastCheckIn === today) return; // already logged

    var prevStreak = state.streak;
    var isFreshStart = false;
    var previousBestForRecovery = 0;

    if(state.lastCheckIn && daysBetween(state.lastCheckIn, today) === 1){
      state.streak = state.streak + 1;
    } else {
      // a genuinely new streak is beginning
      if(state.streak === 0 && state.longest > 0){
        isFreshStart = true;
        previousBestForRecovery = state.longest;
      }
      state.streak = 1;
    }
    state.lastCheckIn = today;
    if(state.history.indexOf(today) === -1) state.history.push(today);

    var isNewPersonalBest = state.streak > state.personalBest && state.personalBest > 0;
    state.longest = Math.max(state.longest, state.streak);
    state.personalBest = Math.max(state.personalBest, state.streak);

    pendingFreezeEarned = false;
    maybeAwardFreeze(state.streak);
    var unlockedMilestone = checkMilestoneUnlock(state.streak);

    var msg;
    if(isFreshStart){
      msg = "Your last flame burned for " + previousBestForRecovery + " day" + (previousBestForRecovery===1?'':'s') + ". Let's see where this one goes.";
    } else {
      msg = nextMessage(state.streak);
    }

    // button success state
    checkInBtn.classList.add('done');
    checkInBtn.disabled = true;
    checkInBtn.setAttribute('aria-pressed', 'true');
    btnLabel.textContent = 'Studied Today';
    checkInBtn.classList.add('pulse');
    setTimeout(function(){ checkInBtn.classList.remove('pulse'); }, 550);

    // count up + flame growth
    countUp(prevStreak, state.streak, 900);
    renderFlameStage(state.streak, true);
    updateStats();
    animateStatCards();
    renderSubLine(isNewPersonalBest);
    renderFreezeBadge(pendingFreezeEarned);

    // message
    messageText.classList.remove('show');
    setTimeout(function(){
      messageText.textContent = msg;
      messageText.classList.add('show');
    }, 250);

    // hearth grid — add today lit with pop
    renderHearth();
    var todayCell = hearthGrid.querySelector('.today-cell');
    if(todayCell){ todayCell.classList.add('lit','new'); }

    // celebration tiers:
    // strong — new personal best, or a major milestone (30/100/365)
    // small  — freeze earned, or a regular milestone (7)
    var isMajorMilestone = unlockedMilestone && unlockedMilestone.day !== 7;
    if(isNewPersonalBest || isMajorMilestone){
      burstConfetti(1.6);
      playChime();
    } else {
      burstConfetti(1);
      playChime();
    }

    if(pendingFreezeEarned){
      // small, distinct celebration for earning a freeze — a quiet toast + soft chime,
      // separate from the day's regular check-in feedback so it doesn't get lost.
      setTimeout(function(){ showFreezeEarnedToast(); playFreezeChime(); }, 900);
    }

    if(unlockedMilestone){
      setTimeout(function(){ showMilestoneCelebration(unlockedMilestone); }, isNewPersonalBest ? 1400 : (pendingFreezeEarned ? 1900 : 500));
    }

    saveState();
  });

  /* ---------------- init ---------------- */
  (function init(){
    state = loadState();

    // Reconcile any days that passed since the app was last open, applying
    // freeze protection one missed day at a time. A freeze only ever covers
    // a single missed day — a gap of 2+ days always breaks the streak,
    // consuming at most one freeze along the way (never more).
    var today = todayStr();
    if(state.lastCheckIn && state.lastCheckIn !== today){
      var gap = daysBetween(state.lastCheckIn, today); // days since last check-in
      var missedDays = gap - 1; // days with no check-in and no freeze applied yet

      if(missedDays === 1 && state.freezes > 0){
        // exactly one missed day, and a freeze is available — protect it
        var frozenDay = addDays(state.lastCheckIn, 1);
        if(state.frozenDates.indexOf(frozenDay) === -1){
          state.frozenDates.push(frozenDay);
        }
        state.freezes -= 1;
        state.lastCheckIn = frozenDay; // streak continuity now runs through the frozen day
        // streak itself is untouched — a freeze preserves, never increases
      } else if(missedDays >= 1){
        // one missed day with no freeze available, or a multi-day gap —
        // the streak has genuinely lapsed.
        state.streak = 0;
      }
      saveState();
    }

    renderMute();
    renderStatic();
  })();

})();
</script>
</body>
